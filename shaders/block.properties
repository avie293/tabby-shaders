# Copyright (c) 2026 Avie29 - Licensed under CC BY-NC 4.0 (see LICENSE)
# Unknown names are simply ignored by Iris.
#
# 10001 = small plants (top waves, flat lighting)
# 10002 = upper half of tall plants (waves completely)
# 10003 = leaves (wave slightly, flat lighting)
# 10005 = flat lighting, no waving
# 10006 = not a solid block (colored light passes through)
# 10010 = water
# 10101 - 10114 = light sources (emissive + colored light, colors in lib/light_colors.glsl)
#         10106 = lava/magma (fully emissive)
# 10130 - 10138 = glowing ores (only the colored ore spots glow)
# 10140 = nether portal (3D effect)
# 10150 = end portal & end gateway (3D star field, block entity)
# 10201 - 10216 = stained glass (tints colored light)

