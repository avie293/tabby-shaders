# --- General ---
oldLighting = false
separateAo = false
frustum.culling = true

# For colored lighting (compute shaders + 3D images). Without support, normal torch light is used.
iris.features.optional = CUSTOM_IMAGES COMPUTE_SHADERS

# --- Shadow pass (as cheap as possible) ---
# Runs for shadows and/or colored lighting (blocks are written into the voxel volume there)
program.shadow.enabled = SHADOWS || COLORED_LIGHTING
program.world-1/shadow.enabled = COLORED_LIGHTING
program.world1/shadow.enabled = SHADOWS || COLORED_LIGHTING
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true

# Colored lighting needs the shadow pass in every dimension, even if no shadows are drawn.
# (Without this line Iris only creates the shadow map if a shader samples it.)
# Translucent blocks only enter the shadow pass for stained glass, not the shadow map.
#ifdef COLORED_LIGHTING
shadow.enabled = true
shadowTranslucent = true
#else
shadowTranslucent = false
#endif

# --- Colored lighting: voxel volume of 128 x 64 x 128 around the player ---
#ifdef COLORED_LIGHTING
image.voxelImg = voxelSampler RED_INTEGER R8UI UNSIGNED_BYTE true false 128 64 128
image.floodImgA = floodSamplerA RGBA RGBA16F HALF_FLOAT false false 128 64 128
image.floodImgB = floodSamplerB RGBA RGBA16F HALF_FLOAT false false 128 64 128
#endif

# --- Volumetric clouds: rendered at half resolution in deferred, vanilla clouds off ---
# deferred = raw image, deferred1 = temporal smoothing (both half resolution), deferred2 = sky
# WARNING: scale.* applies to ALL dimensions. That's why the sky/fog pass is called deferred2 everywhere
# and the names deferred/deferred1 are only used in the overworld for the clouds.
program.deferred.enabled = VOLUMETRIC_CLOUDS
program.deferred1.enabled = VOLUMETRIC_CLOUDS
#ifdef VOLUMETRIC_CLOUDS
clouds = off
scale.deferred = 0.5
scale.deferred1 = 0.5
#endif

# Round sun/moon replace the vanilla textures
#ifdef ROUND_SUN_MOON
sun = false
moon = false
#endif

# --- Time of day system (computed once per frame on the CPU) ---
# sunAngle: 0 = sunrise, 0.25 = noon, 0.5 = sunset, 0.75 = midnight
variable.float.sunElev = sin(sunAngle * 2.0 * pi)
uniform.float.sunVisibility = clamp((sunElev + 0.06) * 6.0, 0.0, 1.0)
uniform.float.moonVisibility = clamp((0.06 - sunElev) * 6.0, 0.0, 1.0)
uniform.float.timeBrightness = sqrt(clamp(sunElev, 0.0, 1.0))
uniform.float.twilight = clamp(1.0 - abs(sunElev) * 3.5, 0.0, 1.0)
uniform.float.shadowFade = clamp(abs(sunElev) * 12.0 - 0.15, 0.0, 1.0)

# --- Profiles ---
profile.POTATO = !WET_SURFACES !RAIN_RIPPLES !VOLUMETRIC_CLOUDS !SHADOWS !COLORED_LIGHTING !LIGHT_SHAFTS !WAVING_PLANTS !WAVING_LEAVES !WATER_WAVES !WATER_REFLECTIONS !WATER_DEPTH !WATER_SSR !WATER_REFRACTION
profile.LOW    = WET_SURFACES RAIN_RIPPLES !VOLUMETRIC_CLOUDS !SHADOWS !COLORED_LIGHTING !LIGHT_SHAFTS WAVING_PLANTS WAVING_LEAVES WATER_WAVES WATER_REFLECTIONS WATER_DEPTH !WATER_SSR WATER_REFRACTION
profile.MEDIUM = WET_SURFACES RAIN_RIPPLES !VOLUMETRIC_CLOUDS SHADOWS shadowMapResolution=1024 shadowDistance=96.0 SHADOW_FILTER=1 COLORED_LIGHTING LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=8 WAVING_PLANTS WAVING_LEAVES WATER_WAVES WATER_REFLECTIONS WATER_DEPTH WATER_SSR SSR_STEPS=16 WATER_REFRACTION
profile.HIGH   = WET_SURFACES RAIN_RIPPLES VOLUMETRIC_CLOUDS VC_QUALITY=16 SHADOWS shadowMapResolution=2048 shadowDistance=160.0 SHADOW_FILTER=1 COLORED_LIGHTING LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=12 WAVING_PLANTS WAVING_LEAVES WATER_WAVES WATER_REFLECTIONS WATER_DEPTH WATER_SSR SSR_STEPS=24 WATER_REFRACTION

# --- Menu ---
screen = <profile> <empty> [LIGHTING] [COLORED_LIGHT_SETTINGS] [SHADOW_SETTINGS] [LIGHT_SHAFT_SETTINGS] [SKY] [FOG] [CLOUDS] [WEATHER] [WATER] [MATERIALS] [DIMENSIONS] [WAVING] [POST]
screen.LIGHTING = SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT ambientOcclusionLevel EMISSIVE_BLOCKS EMISSIVE_STRENGTH GLOWING_ORES ORE_GLOW_STRENGTH DYNAMIC_HANDLIGHT HANDLIGHT_RANGE
screen.COLORED_LIGHT_SETTINGS = COLORED_LIGHTING <empty> COLORED_LIGHTING_SATURATION COLORED_LIGHTING_RANGE
screen.SHADOW_SETTINGS = SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance sunPathRotation
screen.LIGHT_SHAFT_SETTINGS = LIGHT_SHAFTS <empty> LIGHT_SHAFT_STRENGTH LIGHT_SHAFT_SAMPLES
screen.SKY = ROUND_SUN_MOON MOON_PHASE_LIGHT SHADER_STARS <empty> SUN_SIZE MOON_SIZE SKY_BRIGHTNESS STAR_BRIGHTNESS
screen.FOG = FOG_DENSITY FOG_START FOG_ALTITUDE CAVE_FOG RAIN_FOG
screen.CLOUDS = VOLUMETRIC_CLOUDS VC_STYLE VC_AMOUNT VC_THICKNESS VC_HEIGHT VC_QUALITY VC_SPEED <empty> <empty> <empty> CLOUD_FADE CLOUD_FADE_CURVE CLOUD_THICKNESS CLOUD_OPACITY CLOUD_DISTANCE CLOUD_HEIGHT_FALLBACK
screen.WATER = WATER_COLOR_MODE WATER_TEXTURE WATER_OPACITY <empty> WATER_DEPTH WATER_DEPTH_STRENGTH WATER_REFLECTIONS <empty> WATER_SSR SSR_STEPS WATER_REFRACTION WATER_REFRACTION_STRENGTH WATER_WAVES WATER_WAVE_STRENGTH WATER_WAVE_SPEED
screen.WEATHER = WET_SURFACES PUDDLE_AMOUNT RAIN_RIPPLES RAIN_OPACITY LIGHTNING_FLASH RAINBOW
screen.MATERIALS = PBR PBR_NORMAL_STRENGTH FANCY_PORTALS PORTAL_BRIGHTNESS
screen.DIMENSIONS = END_STORMS NETHER_LAVA_GLOW
screen.WAVING = WAVING_PLANTS WAVING_LEAVES WAVING_SPEED
screen.POST = EXPOSURE SATURATION VIGNETTE VIGNETTE_STRENGTH

sliders = ORE_GLOW_STRENGTH PBR_NORMAL_STRENGTH PORTAL_BRIGHTNESS HANDLIGHT_RANGE SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT ambientOcclusionLevel EMISSIVE_STRENGTH \
    COLORED_LIGHTING_SATURATION COLORED_LIGHTING_RANGE LIGHT_SHAFT_STRENGTH LIGHT_SHAFT_SAMPLES \
    shadowMapResolution shadowDistance sunPathRotation \
    SUN_SIZE MOON_SIZE SKY_BRIGHTNESS STAR_BRIGHTNESS \
    FOG_DENSITY FOG_START RAIN_FOG \
    PUDDLE_AMOUNT RAIN_OPACITY VC_AMOUNT VC_THICKNESS VC_HEIGHT VC_QUALITY VC_SPEED CLOUD_FADE CLOUD_FADE_CURVE CLOUD_THICKNESS CLOUD_OPACITY CLOUD_DISTANCE CLOUD_HEIGHT_FALLBACK \
    WATER_TEXTURE WATER_OPACITY WATER_DEPTH_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED SSR_STEPS WATER_REFRACTION_STRENGTH WAVING_SPEED EXPOSURE SATURATION VIGNETTE_STRENGTH
